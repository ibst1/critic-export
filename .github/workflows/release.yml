name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        shell: powershell
        run: .\build.ps1

      - name: Create release and attach zip
        uses: softprops/action-gh-release@v2
        with:
          files: dist/critic-export-*.zip
          generate_release_notes: true
